# ---------------------------------------------------------------------
# Perfil "https": mesma aplicacao, transporte com TLS.
#
# Uso:  mvnw spring-boot:run -Dspring-boot.run.profiles=https
#   ou  java -jar target/smarthas-api-0.0.1-SNAPSHOT.jar --spring.profiles.active=https
#
# O certificado e autoassinado e vale so para desenvolvimento: ele e
# gerado na propria maquina por config/gerar_certificado.bat e nao entra
# no repositorio. Em producao entraria um certificado emitido por uma
# autoridade certificadora, sem mudar mais nada aqui.
# ---------------------------------------------------------------------
server.port=${HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:file:config/smarthas-local.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:smarthas-local}
server.ssl.key-alias=smarthas

# Protocolos antigos ficam de fora: so TLS 1.2 e 1.3.
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Com TLS ligado, o navegador passa a receber HSTS nas respostas.
smarthas.security.hsts=true

# As origens do painel e do aplicativo tambem mudam de esquema.
smarthas.cors.allowed-origins=https://localhost:4200,https://localhost:8081,https://localhost:19006,http://localhost:4200,http://localhost:8081,http://localhost:19006
