spring.application.name=smarthas-api

# ---------------------------------------------------------------------
# Oracle (Fase 6)
# As credenciais nao ficam neste arquivo. Elas sao lidas de variaveis de
# ambiente ou do arquivo local config/oracle.properties, que esta fora do
# git. Veja config/oracle.properties.example.
# ---------------------------------------------------------------------
spring.config.import=optional:file:config/oracle.properties
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool enxuto: o schema do aluno na FIAP tem limite baixo de sessoes.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=smarthas-oracle

# JWT emitido pelo proprio backend (subject = id do usuario no Oracle)
smarthas.jwt.secret=${JWT_SECRET:troque-este-valor-em-producao-smarthas-fase6-chave-hmac-256bits}
smarthas.jwt.expiration-ms=86400000

# ---------------------------------------------------------------------
# Origens liberadas no CORS. Lista fechada em vez de curinga: o painel
# Angular e o aplicativo em desenvolvimento. Chamada sem cabecalho Origin,
# como a do aplicativo nativo, nao passa por CORS e continua funcionando.
# ---------------------------------------------------------------------
smarthas.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:8081,http://localhost:19006,http://10.0.2.2:8081}

# HSTS so faz sentido quando a conexao e HTTPS (ver application-https.properties)
smarthas.security.hsts=false

# Springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=8080
