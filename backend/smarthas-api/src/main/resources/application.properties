spring.application.name=smarthas-api

# Firebase (Firestore + Firebase Authentication)
# Service account key must exist at this path relative to the app's working
# directory (i.e. run ./mvnw spring-boot:run from backend/smarthas-api).
firebase.credentials-path=config/firebase-service-account.json
firebase.project-id=smarthas-d35ee
# Web API key, needed for the Identity Toolkit signInWithPassword REST call
# (Firebase Admin SDK has no server-side password verification API).
firebase.web-api-key=AIzaSyAo9Hc1RQJlcvPXEnbGMqBHsmVLCCSTc_w

# JWT (own token, unrelated to Firebase ID tokens - subject = Firebase UID)
smarthas.jwt.secret=smarthas-fase5-cap1-super-secret-key-change-me-please-2026
smarthas.jwt.expiration-ms=86400000

# Springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=8080
