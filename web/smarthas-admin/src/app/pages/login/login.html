<div class="auth-page">
  <form class="auth-card" (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <h1>Smart HAS — Admin</h1>
    <p class="subtitle">Entre com sua conta de administrador</p>

    <label for="email">E-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      required
      placeholder="admin@smarthas.com"
    />

    <label for="password">Senha</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
      placeholder="••••••••"
    />

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" [disabled]="loading || loginForm.invalid">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>

    <a class="back-link" routerLink="/home">&larr; Voltar para a página inicial</a>
  </form>
</div>
